spring.application.name=gst-billing-test

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/gst_billing?options=-c%20timezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

server.port=8081

app.jwt.secret=test-secret-key-at-least-32-characters-long-for-unit-and-integration-tests!
app.jwt.expiration-ms=86400000
app.upload-dir=uploads
app.encryption.secret=test-encryption-key-for-aes-32b!
