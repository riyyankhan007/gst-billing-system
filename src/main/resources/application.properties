spring.application.name=gst-billing

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/gst_billing?options=-c%20timezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=true

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when-authorized}
management.endpoint.health.probes.enabled=true

server.port=${PORT:8081}

# Security: JWT secret MUST be supplied via environment variable (minimum 256 bits / 32 bytes)
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.upload-dir=${APP_UPLOAD_DIR:uploads}
app.encryption.secret=${APP_ENCRYPTION_SECRET:}

# Object Storage Configuration (auto-selects Cloudflare R2 when credentials are set)
app.storage.provider=${APP_STORAGE_PROVIDER:auto}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.endpoint=${R2_ENDPOINT:}
r2.bucket-name=${R2_BUCKET_NAME:}
r2.public-url=${R2_PUBLIC_URL:}

# Mail settings
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${APP_MAIL_FROM:noreply@gstbilling.com}
app.mail.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

