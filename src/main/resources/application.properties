spring.application.name=gst-billing

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/gst_billing?options=-c%20timezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=true

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when-authorized}
management.endpoint.health.probes.enabled=true

server.port=${PORT:8081}

app.jwt.secret=${APP_JWT_SECRET:change-this-development-secret-key-to-at-least-32-bytes-long}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.upload-dir=${APP_UPLOAD_DIR:uploads}

# Mail settings (Optional: can be provided via environment variables)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false

app.mail.from=${APP_MAIL_FROM:noreply@gstbilling.com}
app.mail.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
