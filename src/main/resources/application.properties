spring.application.name=gst-billing

spring.datasource.url=jdbc:postgresql://localhost:5433/gst_billing
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8081

app.jwt.secret=change-this-development-secret-key-to-at-least-32-bytes-long
app.jwt.expiration-ms=86400000
app.upload-dir=uploads
