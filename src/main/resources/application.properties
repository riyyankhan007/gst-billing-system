spring.application.name=gst-billing

spring.datasource.url=jdbc:postgresql://localhost:5433/gst_billing?options=-c%20timezone=Asia/Kolkata
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8081

app.jwt.secret=change-this-development-secret-key-to-at-least-32-bytes-long
app.jwt.expiration-ms=86400000
app.upload-dir=uploads

# Mail settings (Optional: can be provided via environment variables)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false

app.mail.from=${APP_MAIL_FROM:noreply@gstbilling.com}
app.mail.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

